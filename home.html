<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Inter', sans-serif; background:#fff; color:#333; }
    header { background:#e53935; color:#fff; padding:30px 20px 60px; text-align:center; }
    .logo { font-weight:600; font-size:32px; }
    header h1 { margin:16px 0 0; font-size:24px; }
    header p { margin:8px 0 0; font-size:14px; line-height:1.4; }
    main { background:#fff; margin-top:-40px; border-radius:20px 20px 0 0; padding:32px 20px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
    .item { display:flex; flex-direction:column; align-items:center; justify-content:center; background:#f5f5f5; border-radius:12px; padding:16px; text-decoration:none; color:#333; font-size:14px; height:100px; }
    .item span { font-size:28px; margin-bottom:8px; }
    .item.news { font-weight:600; }
    .item.filler { visibility:hidden; pointer-events:none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">top<sup>1</sup></div>
    <h1>Привет Алексей Логинов</h1>
    <p>Мы тут решили дать волю фантазии и представили, как бы выглядел Майбу — студент Академии TOP!</p>
  </header>
  <main>
    <div class="grid">
      <div class="item news">Пары закончились</div>
      <a class="item" href="#"><span>📊</span>Оценки</a>
      <a class="item" href="#"><span>📚</span>ДЗ</a>
      <a class="item" href="#"><span>📅</span>Расписание</a>
      <a class="item" href="#"><span>💬</span>Отзыв о студенте</a>
      <a class="item" href="#"><span>📖</span>Учебные материалы</a>
      <div class="item filler"></div>
      <a class="item" href="permissions-form.html"><span>📝</span>Цифровое разрешение на выход</a>
    </div>
  </main>
</body>
</html>
