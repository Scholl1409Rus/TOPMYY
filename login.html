<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #333;
    }
    header {
      background: #e53935;
      padding: 40px 0;
      text-align: center;
    }
    header img {
      width: 80px;
    }
    main {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    input {
      width: 260px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      font-size: 16px;
    }
    button {
      width: 260px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #e53935;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://top-academy.ru/logo.svg" alt="top" />
  </header>
  <main>
    <input type="text" placeholder="Логин" />
    <input type="password" placeholder="Пароль" />
    <a href="greeting.html" style="text-decoration:none;width:260px;">
      <button type="button">Войти</button>
    </a>
  </main>
</body>
</html>
